; Menaikkan batas upload file (default hosting sering cuma 2MB, terlalu kecil
; untuk foto KTP/rumah dari kamera HP modern). Otomatis dibaca PHP-FPM/suPHP
; di hosting cPanel tanpa perlu akses php.ini server.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 20

; Mitigasi sementara PHP2Shell (CVE-2026-109618 & CVE-2026-109619) sesuai
; rekomendasi php2shell.com. Solusi utuhnya tetap upgrade PHP ke 8.2.35 /
; 8.3.36 / 8.4.27 / 8.5.12 ke atas. Setelah server terupgrade, memory_limit
; boleh dikembalikan ke nilai semula (mis. 256M).
; - OOM di tengah request = pemicu CVE-2026-109618; batas memori diserahkan ke
;   limit akun hosting (CloudLinux LVE / cgroup), bukan ke PHP.
memory_limit = -1
; - Jalur serangan lewat PHPSESSID + multipart upload; fitur ini tidak dipakai.
session.upload_progress.enabled = 0
; - Form aplikasi paling dalam cuma 1 level array (name="x[]").
max_input_nesting_level = 16
display_errors = 0
log_errors = 1
; - Hanya berlaku di PHP 8.5, diabaikan di versi lain.
fatal_error_backtraces = 0
